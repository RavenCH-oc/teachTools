[package]
name = "classroom-teacher"
version = "0.1.0"
description = "Classroom Teacher desktop application"
authors = ["Classroom"]
edition = "2021"
rust-version = "1.88"
build = "build.rs"

[lib]
name = "teacher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "ws"] }
base64 = "0.22"
getrandom = "0.3"
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
futures-util = "0.3"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.34", features = ["bundled"] }
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
uuid = { version = "1", features = ["v7"] }
unicode-normalization = "0.1"
tauri-plugin-dialog = "2"
network-interface = "2"
tower-http = { version = "0.6", default-features = false, features = ["limit"] }
rust_xlsxwriter = { version = "=0.79.0", default-features = false }

[target.'cfg(windows)'.dependencies]
keyring-core = "1.0.0"
windows-native-keyring-store = "1.1.0"

[dev-dependencies]
tempfile = "3"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
