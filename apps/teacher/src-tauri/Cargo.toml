[package]
name = "classroom-teacher"
version = "0.1.0"
description = "Classroom Teacher desktop application"
authors = ["Classroom"]
edition = "2021"
rust-version = "1.77"
build = "build.rs"

[lib]
name = "teacher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "ws"] }
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync"] }
rusqlite = { version = "0.34", features = ["bundled"] }
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
uuid = { version = "1", features = ["v7"] }
unicode-normalization = "0.1"
tauri-plugin-dialog = "2"
network-interface = "2"
tower-http = { version = "0.6", default-features = false, features = ["limit"] }

[dev-dependencies]
tempfile = "3"
futures-util = "0.3"
tokio-tungstenite = "0.28"
